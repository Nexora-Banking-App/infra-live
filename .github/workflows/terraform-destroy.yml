name: "Terraform - Destroy Test Environment"

# Only triggered manually from the GitHub Actions UI
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "destroy" to confirm tearing down the test environment:'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./test

    steps:
      # 1. Safety Check: Require typing "destroy"
      - name: Verify Confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "destroy" ]; then
            echo "Confirmation text did not match 'destroy'. Aborting!"
            exit 1
          fi

      # 2. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Setup Git for private modules
      - name: Configure Git for Private Modules
        run: |
          git config --global url."https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      # 5. Authenticate to AWS via OIDC
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # 6. Initialize Terraform with S3 backend
      - name: Terraform Init
        run: terraform init

      # 7. Execute Destroy
      - name: Terraform Destroy
        run: terraform destroy -auto-approve